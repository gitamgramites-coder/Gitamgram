<style>
:root{--bg:#0b0712;--card:#150e21;--card2:#1d1430;--line:#2c2040;--p:#8b3cf0;--p2:#c026d3;--tx:#f4eefc;--mu:#9a8fb0;--ok:#22c55e;--bad:#ef4444;--warn:#f59e0b;
--grad:linear-gradient(135deg,#c026d3,#7c3aed)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--tx);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--p)}
select option{background:var(--card2)}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.fill{fill:currentColor}
#app{height:100%;display:flex;justify-content:center}
.shell{width:100%;max-width:520px;height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative;border-left:1px solid var(--line);border-right:1px solid var(--line)}

.wm{background:none!important;-webkit-background-clip:border-box!important;color:#2fd5b8!important;filter:none!important;text-shadow:0 0 18px #2fd5b833}.wm span{color:#f6b21b}
.logo{font-family:'Oxanium','Segoe UI',sans-serif;font-weight:700;font-size:21px;letter-spacing:2px;line-height:1.1;background:linear-gradient(100deg,#fff 0%,#efe0ff 50%,#c97bff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(179,47,224,.55));padding:0 3px;white-space:nowrap}
.icons{display:flex;gap:2px;align-items:center;margin-left:auto;order:2}.brand{display:flex;align-items:center;gap:9px;flex:none;order:1}.scopewrap{order:3;flex-basis:100%}.sshort{display:none}.top .logo{font-size:17px;letter-spacing:1.5px}.ibtn{width:36px;height:36px}
.ibtn{position:relative;display:grid;place-items:center;width:36px;height:36px;border-radius:50%}
.ibtn:hover{background:var(--card2)}
.dot{position:absolute;top:4px;right:4px;min-width:16px;height:16px;border-radius:8px;background:var(--bad);font-size:10px;display:grid;place-items:center;font-weight:700;padding:0 4px}
.main{flex:1;overflow-y:auto;scroll-behavior:smooth}
.nav{display:flex;justify-content:space-around;border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom));background:var(--bg);flex:none}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mu);padding:4px 10px}
.nav button.on{color:var(--tx)}
.nav button.on svg{stroke:var(--p2)}
.nav .plus{background:var(--grad);width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;margin-top:-2px}
.av{border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;position:relative}
.stories{display:flex;gap:14px;padding:14px 16px;overflow-x:auto;scrollbar-width:none}
.story{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--mu);width:64px;flex:none}
.ring{padding:3px;border-radius:50%;background:var(--grad)}.ring.seen{background:var(--line)}
.ring .av{border:3px solid var(--bg)}
.chips{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none}
.chip{padding:7px 14px;border-radius:20px;background:var(--card2);color:var(--mu);font-size:13px;white-space:nowrap;border:1px solid var(--line)}
.chip.on{background:var(--grad);color:#fff;border-color:transparent}
.post{border-top:1px solid var(--line);padding-bottom:6px}
.ph{display:flex;align-items:center;gap:10px;padding:10px 16px}
.ph b{font-size:14px}.ph small{color:var(--mu);font-size:12px;display:block}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;padding:2px 7px;border-radius:10px;background:#2a1650;color:#c4a1ff;margin-left:6px;font-weight:600}
.bdg{vertical-align:-3px;margin-left:4px;flex:none;display:inline-block}
.scopebtn{display:flex;align-items:center;gap:4px;padding:5px 9px;border-radius:16px;background:var(--card2);border:1px solid var(--line);font-size:12px;font-weight:600;white-space:nowrap}.scopebtn svg{width:14px;height:14px}.sshort{display:none}

.vtick{width:15px;height:15px;stroke:#60a5fa;fill:#60a5fa22;vertical-align:-3px;margin-left:3px}
.skel{background:linear-gradient(90deg,#ffffff10,#ffffff24,#ffffff10);background-size:200% 100%;animation:skl 1.2s infinite}@keyframes skl{to{background-position:-200% 0}}
.cscroll{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;height:100%;scrollbar-width:none}.cscroll::-webkit-scrollbar{display:none}.cscroll img{flex:none;width:100%;height:100%;object-fit:cover;scroll-snap-align:center}
.ccnt{position:absolute;right:10px;top:10px;background:#000a;color:#fff;font-size:12px;border-radius:12px;padding:2px 9px;z-index:2}
.cnav{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;background:#000a;color:#fff;font-size:22px;line-height:1;z-index:2;display:none;place-items:center}.car:hover .cnav{display:grid}.cnav.l{left:8px}.cnav.r{right:8px}
.cdots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:5px;z-index:2}.cdots i{width:6px;height:6px;border-radius:50%;background:#fff6}.cdots i.on{background:#fff}
.vov{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:2;opacity:0;transition:opacity .15s}
.vov.show{opacity:1}.vov::before{content:"";width:64px;height:64px;border-radius:50%;background:#0009;grid-area:1/1}.vov svg{grid-area:1/1;width:30px;height:30px;color:#fff;fill:#fff;position:relative}
.vov.pause{opacity:1}
.media{aspect-ratio:4/5;display:grid;place-items:center;font-size:44px;font-weight:800;color:#fff9;background-size:cover;background-position:center;text-align:center;padding:24px;line-height:1.1;letter-spacing:-1px}
.act{display:flex;gap:16px;padding:10px 16px 2px;align-items:center}
.act .sp{flex:1}
.act button{display:flex;gap:5px;align-items:center}
.liked svg{fill:var(--p2);stroke:var(--p2)}
.saved svg{fill:var(--tx)}
.cap{padding:2px 16px;font-size:14px;line-height:1.4}
.cap .tag{color:#b78bff}
.muted{color:var(--mu)}.small{font-size:12px}
.sec{padding:16px}
h2{font-size:18px;margin-bottom:10px}h3{font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.row{display:flex;align-items:center;gap:12px}
.list>*+*{margin-top:10px}
.btn{background:var(--grad);color:#fff;border-radius:12px;padding:12px 18px;font-weight:600;text-align:center;width:100%}
.btn.sm{width:auto;padding:7px 14px;font-size:13px;border-radius:10px}
.btn.ghost{background:var(--card2);border:1px solid var(--line);color:var(--tx)}
.btn.danger{background:#3b1219;color:#fca5a5;border:1px solid #5b1c26}
.btn.ok{background:#10351f;color:#86efac;border:1px solid #1b5a35}
.btn:disabled{opacity:.5}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.grid3 .media{aspect-ratio:4/5;font-size:14px;padding:6px}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1;padding:12px 10px;color:var(--mu);white-space:nowrap;border-bottom:2px solid transparent;font-size:14px}
.tabs button.on{color:var(--tx);border-color:var(--p2)}
.stat{display:flex;gap:28px;justify-content:center;text-align:center;margin:12px 0}
.stat b{display:block;font-size:18px}.stat span{font-size:12px;color:var(--mu)}
.pill{font-size:11px;padding:3px 9px;border-radius:10px;font-weight:600;display:inline-block}
.pill.email_pending,.pill.verification_pending{background:#3a2d0a;color:#fcd34d}
.pill.under_review{background:#0c2a4a;color:#93c5fd}
.pill.verified,.pill.approved{background:#10351f;color:#86efac}
.pill.rejected,.pill.suspended{background:#3b1219;color:#fca5a5}
.pill.not_started{background:#2a2540;color:#c9c2e6}.pill.processing{background:#0c2a4a;color:#93c5fd}.pill.solved{background:#10351f;color:#86efac}
.pill.pending{background:#3a2d0a;color:#fcd34d}
.overlay{position:absolute;inset:0;background:#000d;z-index:50;display:flex;flex-direction:column;justify-content:flex-end}
.sheet{background:var(--card);border-radius:20px 20px 0 0;max-height:82%;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.sheet .hd{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-weight:700}
.sheet .bd{overflow-y:auto;padding:14px 16px;flex:1}
.full{position:absolute;inset:0;z-index:60;background:#000;display:grid;place-items:center;container-type:size}
.bar{display:flex;gap:4px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top))}
.bar i{flex:1;height:3px;background:#fff4;border-radius:2px;overflow:hidden;display:block}
.bar i b{display:block;height:100%;background:#fff;width:0}
.bar i.done b{width:100%}.bar i.run b{animation:fill 5s linear forwards}
@keyframes fill{to{width:100%}}
.grid3.r .media{aspect-ratio:9/16}
.reels{scrollbar-width:none;scroll-snap-type:y mandatory;overflow-y:auto;height:100%;container-type:size;background:#000}
.reel{scroll-snap-align:start;height:100%;display:grid;place-items:center;background:#000}
.rf,.sf{position:relative;overflow:hidden;height:min(100cqh,177.78cqw);aspect-ratio:9/16;background:#222}
.scrim{position:absolute;inset:0;background:linear-gradient(transparent 55%,#000b)}
.rf .info{position:absolute;left:14px;bottom:16px;right:72px;z-index:1}
.stop{position:absolute;top:0;left:0;right:0;z-index:2;background:linear-gradient(#000a,transparent);padding-bottom:14px}
.stxt{position:absolute;inset:0;display:grid;place-items:center;font-size:30px;font-weight:800;text-align:center;padding:30px}
.stxt.cap{inset:auto 0 0 0;font-size:18px;font-weight:600;background:linear-gradient(transparent,#000b);padding:40px 20px 24px}
.reel .rside{position:absolute;right:10px;bottom:80px;z-index:1;display:flex;flex-direction:column;gap:18px;align-items:center;font-size:12px}
.reel .rside button{display:flex;flex-direction:column;align-items:center;gap:3px;text-shadow:0 1px 4px #0008}
.reel .info{text-shadow:0 1px 6px #000a;z-index:1;max-width:80%}
.msg{max-width:78%;padding:9px 13px;border-radius:16px;margin:4px 0;line-height:1.35;font-size:14px;word-wrap:break-word}
.msg.me{background:var(--grad);margin-left:auto;border-bottom-right-radius:4px}
.msg.them{background:var(--card2);border-bottom-left-radius:4px}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:20px;font-size:13px;font-weight:600;z-index:90;max-width:90%;box-shadow:0 6px 24px #0008}
.auth{flex:1;overflow-y:auto;padding:28px 22px;display:flex;flex-direction:column;gap:14px}
.hero{background:radial-gradient(circle at 30% 0%,#7c3aed55,transparent 60%),radial-gradient(circle at 90% 30%,#c026d355,transparent 55%);border-radius:24px;padding:28px 20px;border:1px solid var(--line)}
.hero h1{font-size:34px;line-height:1.05;letter-spacing:-1px;margin:10px 0}
label{display:block;font-size:12px;color:var(--mu);margin:0 0 5px 2px}
.steps{display:flex;gap:6px;margin-bottom:4px}.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}.steps i.on{background:var(--p2)}
.err{color:#fca5a5;font-size:13px}
.toggle{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:none;transition:.2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on{background:var(--p)}.toggle.on::after{left:21px}
.sp{flex:1}
.kv{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.empty{text-align:center;color:var(--mu);padding:40px 20px}
/* Admin */
.adm{display:flex;height:100%;width:100%;max-width:1200px}
.side{width:220px;border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:2px;flex:none;overflow-y:auto}
.side button{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;color:var(--mu);text-align:left}
.side button.on{background:var(--card2);color:var(--tx)}
.adm .content{flex:1;overflow-y:auto;padding:22px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi b{font-size:26px;display:block}.kpi span{color:var(--mu);font-size:12px}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px}
.bars div{flex:1;background:var(--grad);border-radius:6px 6px 0 0;min-height:6px;position:relative}
.bars small{position:absolute;bottom:-18px;left:0;right:0;text-align:center;color:var(--mu);font-size:10px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--mu);font-weight:500;font-size:12px}
@media(max-width:760px){.adm{flex-direction:column}.side{width:100%;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}.side button{white-space:nowrap}.adm .content{padding:14px}}
@media(min-width:900px){.shell:not(.wide){border-radius:0}}
#ed{position:fixed;inset:0;z-index:300;background:#050309;display:flex;flex-direction:column;color:var(--tx);user-select:none;-webkit-user-select:none}
#ed .edtop{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));border-bottom:1px solid var(--line)}
#ed .edprev{flex:1;min-height:0;display:grid;place-items:center;background:repeating-conic-gradient(#0d0816 0 25%,#120b1e 0 50%) 0 0/20px 20px;overflow:hidden;position:relative}
#ed canvas{touch-action:none;cursor:grab;box-shadow:0 0 0 1.5px #fff6,0 8px 40px #000a;background:#000;display:block}
#ed canvas.drag{cursor:grabbing}
#ed .edpanel{padding:12px 14px;padding-bottom:calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);height:228px;overflow-y:auto;background:var(--card)}
#ed .edtabs{display:flex;border-top:1px solid var(--line);background:var(--bg);overflow-x:auto;scrollbar-width:none}
#ed .edtabs button{flex:1;padding:11px 8px;font-size:12.5px;color:var(--mu);white-space:nowrap;border-bottom:2px solid transparent}
#ed .edtabs button.on{color:var(--tx);border-color:var(--p2)}
.edchip{padding:8px 14px;border-radius:18px;background:var(--card2);border:1px solid var(--line);font-size:13px;color:var(--mu);white-space:nowrap}
.edchip.on{background:var(--grad);color:#fff;border-color:transparent}
.edrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.edrow+.edrow,.edsl+.edsl,.edrow+.edsl,.edsl+.edrow{margin-top:10px}
.edsl{display:flex;align-items:center;gap:10px;font-size:13px}.edsl span:first-child{width:62px;color:var(--mu)}.edsl span:last-child{width:42px;text-align:right}
.edsl input[type=range]{padding:0;border:0;background:none;accent-color:#c026d3;height:24px}
.edcard{flex:1;min-width:150px;padding:12px;border-radius:14px;border:1.5px solid var(--line);background:var(--card2);text-align:left}
.edcard.on{border-color:var(--p2);background:#2a1650}
.edcard b{display:block;margin-bottom:2px}.edcard small{color:var(--mu);font-size:12px;line-height:1.3;display:block}
</style>
</head>

function extras(){const names=new Set(U.map(u=>u.name));return Object.values(S.students).flat().filter(x=>!names.has(x.name)).map((x,i)=>({id:1000+i,name:x.name,un:x.email.split("@")[0],dept:x.dept||"Student",campus:"hyd",photo:x.photo,extra:true}))}
const uidAny=id=>id>=1000?(extras().find(e=>e.id===id)||{id,name:"Member",un:"member",extra:true}):uid(id);
function followersOf(id){
 if(id===100)return[...U.filter(u=>!u.isOfficial).map(u=>u.id),...(S.me.isOfficial?[]:[0]),...extras().map(e=>e.id)];
 if(id===0)return[...S.followers];
 const r=Object.keys(G).map(Number).filter(k=>G[k].includes(id));if(S.follows.has(id))r.push(0);return r}
function followingOf(id){if(id===100)return[];if(id===0)return[...S.follows];return[...(G[id]||[]),100,...(S.followers.has(id)?[0]:[])]}
function mutualOf(id){if(S.me.isOfficial)return[];const mine=new Set(followingOf(0));return id===0?followersOf(0).filter(x=>mine.has(x)):followersOf(id).filter(x=>mine.has(x)&&x!==id&&x!==0)}
function mutualStrip(u){const m=mutualOf(u.id);if(!m.length)return"";const n=m.slice(0,2).map(id=>`<b style="color:var(--tx)">${esc(uid(id).un)}</b>`),more=m.length-n.length;return `<button data-act="conn" data-id="${u.id}:mutual" class="small muted" style="display:block;text-align:left;margin-top:8px">Followed by ${n.join(", ")}${more>0?" + "+more+" more":""}</button>`}

function cropImage(file,w,h,cb){const img=new Image(),url=URL.createObjectURL(file);
 img.onload=()=>{const c=document.createElement("canvas");c.width=w;c.height=h;const r=Math.max(w/img.width,h/img.height),dw=img.width*r,dh=img.height*r;c.getContext("2d").drawImage(img,(w-dw)/2,(h-dh)/2,dw,dh);URL.revokeObjectURL(url);cb(c.toDataURL("image/jpeg",.82))};
 img.onerror=()=>{URL.revokeObjectURL(url);cb(null)};img.src=url}

const RMAP={"1:1":1,"4:5":.8,"3:4":.75,"9:16":9/16,"16:9":16/9};

function openEditor(o){ // {src,type,prev,done}
 const img=new Image();
 img.onload=()=>{const m=Math.max(img.width,img.height),k=m>3000?3000/m:1,c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  ED.base=c;ED.ok="";ED.type=o.type;ED.done=o.done;ED.src=o.src;ED.lock=o.lock||(o.type==="reel"||o.type==="story"?9/16:o.type==="avatar"?1:0);
  ED.st=o.prev?JSON.parse(JSON.stringify(o.prev)):{rot:0,fx:false,fy:false,l:0,r:0,t:0,b:0,ratio:"4:5",fit:false,bg:"blur",zoom:1,ox:0,oy:0,outW:o.type==="avatar"?512:1080,tab:ED.lock?"crop":"aspect"};
  if(ED.lock&&ED.st.tab==="aspect")ED.st.tab="crop";
  buildEditor()};

function orient(){const st=ED.st,k=st.rot+"|"+st.fx+"|"+st.fy;if(ED.ok===k&&ED.o)return ED.o;const b=ED.base,w=st.rot%2?b.height:b.width,h=st.rot%2?b.width:b.height,c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.translate(w/2,h/2);x.rotate(st.rot*Math.PI/2);x.scale(st.fx?-1:1,st.fy?-1:1);x.drawImage(b,-b.width/2,-b.height/2);ED.o=c;ED.ok=k;return c}
function edRatio(){const st=ED.st;if(ED.lock)return ED.lock;const o=orient();if(st.ratio==="free")return(o.width*(1-st.l-st.r))/(o.height*(1-st.t-st.b));return RMAP[st.ratio]}
function edOut(){const r=edRatio(),w=ED.st.outW;return[w,Math.min(4320,Math.round(w/r))]}
function edDraw(ctx,W,H){const st=ED.st,o=orient(),sx=st.l*o.width,sy=st.t*o.height,sw=o.width*(1-st.l-st.r),sh=o.height*(1-st.t-st.b);
 ctx.clearRect(0,0,W,H);
 if(st.fit){if(st.bg==="blur"&&"filter" in ctx){ctx.save();ctx.filter="blur("+Math.round(W/22)+"px)";const k=Math.max(W/sw,H/sh)*1.2;ctx.drawImage(o,sx,sy,sw,sh,(W-sw*k)/2,(H-sh*k)/2,sw*k,sh*k);ctx.restore();ctx.fillStyle="#0006";ctx.fillRect(0,0,W,H)}else{ctx.fillStyle=st.bg==="white"?"#fff":"#000";ctx.fillRect(0,0,W,H)}}
 const s0=st.fit?Math.min(W/sw,H/sh):Math.max(W/sw,H/sh),s=s0*st.zoom,dw=sw*s,dh=sh*s,mx=Math.abs(dw-W)/2/W,my=Math.abs(dh-H)/2/H;
 st.ox=clampN(st.ox,-mx,mx);st.oy=clampN(st.oy,-my,my);
 ctx.drawImage(o,sx,sy,sw,sh,(W-dw)/2+st.ox*W,(H-dh)/2+st.oy*H,dw,dh)}
function edLayout(){const pv=ED.el.querySelector(".edprev"),cv=ED.el.querySelector("canvas"),r=edRatio(),aw=pv.clientWidth-28,ah=pv.clientHeight-28,w=Math.max(60,Math.min(aw,ah*r)),h=w/r,d=window.devicePixelRatio||1;
